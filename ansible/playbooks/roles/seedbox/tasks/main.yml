---
- name: Create Deluge group
  ansible.builtin.group:
    name: debian-deluged
    gid: 113
    system: true
    state: present

- name: Create Deluge user
  ansible.builtin.user:
    name: debian-deluged
    uid: 107
    group: debian-deluged
    system: true
    home: /var/lib/deluged
    create_home: true
    shell: /usr/sbin/nologin
    state: present

- name: Ensure deluge is installed
  apt:
    name:
      - deluged
      - deluge-web
    state: present
    update_cache: yes

- name: Configure deluge
  ansible.builtin.import_tasks: update_deluge_config.yml

- name: Add deluge user to the smb users group
  user:
    name: debian-deluged
    groups: smbusers
    append: yes

- name: Ensure permissions for seedbox contents
  file:
    path: /mnt/files/files/seedbox
    mode: "0775"
    recurse: yes

- name: Ensure Deluge systemd service file has correct UMask
  lineinfile:
    path: /lib/systemd/system/deluged.service
    regexp: '^(\s*)UMask='
    line: "UMask=002"
  notify: Restart deluged completely

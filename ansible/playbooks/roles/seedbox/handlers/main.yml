---
- name: Stop deluge-web
  ansible.builtin.systemd_service:
    name: deluge-web
    state: stopped
  listen: Restart deluged completely

- name: Stop deluged
  ansible.builtin.systemd_service:
    name: deluged
    state: stopped
  listen: Restart deluged completely

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: Restart deluged completely

- name: Start deluged
  ansible.builtin.systemd_service:
    name: deluged
    state: started
  listen: Restart deluged completely

- name: Start deluge-web
  ansible.builtin.systemd_service:
    name: deluge-web
    state: started
  listen: Restart deluged completely

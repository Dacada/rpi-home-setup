---
- name: Install restic
  ansible.builtin.package:
    name: restic
    state: present

- name: Install ACL support for Ansible privilege escalation
  ansible.builtin.package:
    name: acl
    state: present

- name: Create restic configuration directory
  ansible.builtin.file:
    path: /var/lib/restic
    state: directory
    owner: "{{ restic_user }}"
    group: "{{ restic_group }}"
    mode: "0700"

- name: Install restic environment
  ansible.builtin.template:
    src: restic.env.j2
    dest: "{{ restic_env_file }}"
    owner: "{{ restic_user }}"
    group: "{{ restic_group }}"
    mode: "0600"

# if this failed, you may need to manually create the repository
# the next task commented out is basically what would need to run
# but we don't want to run it when the command fails for an unrelated reason and the repository actually exists
- name: Check restic repository
  ansible.builtin.command:
    cmd: restic snapshots
  environment: "{{ restic_command_environment }}"
  become: true
  become_user: "{{ restic_user }}"
  changed_when: false

# - name: Initialize restic repository
#   ansible.builtin.command:
#     cmd: restic init
#   environment: "{{ restic_command_environment }}"
#   become: true
#   become_user: "{{ restic_user }}"
#   when: restic_repository_check.rc != 0

- name: Install restic backup service
  ansible.builtin.template:
    src: restic-backup.service.j2
    dest: /etc/systemd/system/restic-backup.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install restic backup timer
  ansible.builtin.template:
    src: restic-backup.timer.j2
    dest: /etc/systemd/system/restic-backup.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable restic backup timer
  ansible.builtin.systemd_service:
    name: restic-backup.timer
    enabled: true
    state: started
    daemon_reload: true

---
- name: Check if Pi-hole binary exists
  stat:
    path: /usr/local/bin/pihole
  register: pihole_installed

- name: Download Pi-hole installation script
  get_url:
    url: https://install.pi-hole.net
    dest: /tmp/pihole_install.sh
    mode: '0755'
  when: not pihole_installed.stat.exists

- name: Fail if Pi-hole is not installed
  fail:
    msg: "Pi-hole is not installed. Please run the following command on the Pi-hole device to install it: 'sudo bash /tmp/pihole_install.sh'"
  when: not pihole_installed.stat.exists

- name: Configure rsyslog to monitor pihole logs
  template:
    src: "50-pihole.conf.j2"
    dest: "/etc/rsyslog.d/50-pihole.conf"
    owner: root
    group: root
    mode: '0644'
  notify: Restart rsyslog

- name: Enable custom dnsmasq configuration
  ansible.builtin.lineinfile:
    path: /etc/pihole/pihole.toml
    regexp: '^\s*etc_dnsmasq_d\s*='
    line: '  etc_dnsmasq_d = true'
    backrefs: true
  notify: Restart Pi-hole DNS

- name: Verify custom dnsmasq configuration is enabled
  ansible.builtin.command:
    argv:
      - grep
      - -Eq
      - '^\s*etc_dnsmasq_d\s*=\s*true\s*(#.*)?$'
      - /etc/pihole/pihole.toml
  register: dnsmasq_config_check
  changed_when: false
  failed_when: false

- name: Fail if custom dnsmasq configuration is not enabled
  ansible.builtin.assert:
    that:
      - dnsmasq_config_check.rc == 0
    fail_msg: "Pi-hole must have misc.etc_dnsmasq_d = true in /etc/pihole/pihole.toml"

- name: Configure HTTP port
  ansible.builtin.replace:
    path: /etc/pihole/pihole.toml
    after: '^\[webserver\]$'
    before: '^\['
    regexp: '^\s*port\s*=.*$'
    replace: '  port = "8053"'
  notify: Restart Pi-hole DNS

- name: Verify Pi-hole HTTP port configuration
  ansible.builtin.command:
    argv:
      - grep
      - -Eq
      - '^\s*port\s*=\s*"8053"\s*(#.*)?$'
      - /etc/pihole/pihole.toml
  register: pihole_http_port_check
  changed_when: false
  failed_when: false

- name: Fail if Pi-hole HTTP port is not configured
  ansible.builtin.assert:
    that:
      - pihole_http_port_check.rc == 0
    fail_msg: "Pi-hole must have webserver.port = \"8053\" in /etc/pihole/pihole.toml"

- name: Deploy local DNS records
  ansible.builtin.template:
    src: local-dns.conf.j2
    dest: /etc/dnsmasq.d/50-local-dns.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart Pi-hole DNS

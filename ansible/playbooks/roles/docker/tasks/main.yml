---
- name: Ensure required packages for apt over HTTPS are installed
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    update_cache: true
    state: present

- name: Create keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: "{{ docker_gpg_url }}"
    dest: "{{ docker_key_path }}"
    mode: "0644"

- name: Add Docker repository
  ansible.builtin.copy:
    dest: "{{ docker_repo_file }}"
    mode: "0644"
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: {{ ansible_facts['lsb']['codename'] }}
      Components: stable
      Signed-By: {{ docker_key_path }}

# Ensure the storage disk is available before Docker installation.

- name: Verify Docker storage filesystem is mounted
  ansible.builtin.assert:
    that:
      - >-
        ansible_facts['mounts']
        | selectattr('mount', 'equalto', '/mnt/files')
        | list
        | length > 0
    fail_msg: "/mnt/files is not mounted. Refusing to configure Docker."

- name: Create Docker configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Docker data root
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "data-root": "{{ docker_data_root }}"
      }
  notify: Restart Docker

# Prevent Docker from starting without its storage filesystem.

- name: Create Docker systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"

- name: Require storage mount for Docker
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/storage.conf
    mode: "0644"
    content: |
      [Unit]
      RequiresMountsFor={{ docker_data_root }}
  notify: Reload systemd daemon

- name: Apply systemd configuration
  ansible.builtin.systemd:
    daemon_reload: true

# Install and start Docker.

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    update_cache: true
    state: present

- name: Ensure Docker service is running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

# Docker maintenance.

- name: Deploy Docker prune script
  ansible.builtin.template:
    src: docker-prune.sh.j2
    dest: /usr/local/bin/docker-prune.sh
    mode: "0755"

- name: Deploy Docker prune systemd service
  ansible.builtin.template:
    src: docker-prune.service.j2
    dest: /etc/systemd/system/docker-prune.service
  notify: Reload systemd daemon

- name: Deploy Docker prune systemd timer
  ansible.builtin.template:
    src: docker-prune.timer.j2
    dest: /etc/systemd/system/docker-prune.timer
  notify: Reload systemd daemon

- name: Enable and start Docker prune timer
  ansible.builtin.systemd:
    name: docker-prune.timer
    enabled: true
    state: started
    daemon_reload: true
